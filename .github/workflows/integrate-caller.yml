name: Integrate

"on":
  repository_dispatch:
    types: [implementation-opened]

jobs:
  integrate:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    uses: collod873/claude-workflow/.github/workflows/integrate.yml@canary/tracer
    with:
      runner: ubuntu-latest
      machine_ref: canary/tracer
      verify_workflow: verify-caller.yml
