name: Lost-dispatch counter

"on":
  issues:
    types: [labeled]

jobs:
  count:
    permissions:
      contents: read
      actions: read
      issues: write
    if: github.event.label.name == 'sliceable'
    uses: collod873/claude-workflow/.github/workflows/lost-dispatch-counter.yml@canary/tracer
    with:
      runner: ubuntu-latest
      machine_ref: canary/tracer
      slicing_workflow: to-tickets-caller.yml
