name: Run watchdog

"on":
  repository_dispatch:
    types: [session-captured]

jobs:
  watch:
    permissions:
      contents: read
      actions: read
      issues: write
    uses: collod873/claude-workflow/.github/workflows/run-watchdog.yml@canary/tracer
    with:
      runner: ubuntu-latest
      machine_ref: canary/tracer
